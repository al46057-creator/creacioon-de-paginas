<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reserva de citas medicas</title>
</head>
<body>
    
      <h1>reserva de citas medicas</h1>

</body>
</html>

    <form>

        <label for="nombre">Nombre del paciente:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>
        <br>
        <br>

        <label for="fecha">Fecha preferida:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br>
        <br>

        <label for="hora">Hora estimada:</label>
        <input type="time" id="hora" name="hora" required>
        <br>
        <br>

        <label for="mes">Mes ideal:</label>
        <input type="month" id="mes" name="mes" required>
        <br>
        <br>

        <label for="semana">Semana del año:</label>
        <input type="week" id="semana" name="semana" required>
        <br>
        <br>

        <button type="submit">Enviar</button>
        <button type="reset">Cancelar</button>

    </form>

</body>

</html>
